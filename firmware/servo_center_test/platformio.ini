; [env:名称]定义一个独立的PlatformIO编译环境。
[env:esp32-s3-devkitc-1]
; 安装并使用Espressif 32平台、编译器和esptool烧录工具。
platform = espressif32
; 采用ESP32-S3-DevKitC-1基础配置；本程序很小，不使用PSRAM。
board = esp32-s3-devkitc-1
; 使用Arduino框架，程序由setup()和loop()组成。
framework = arduino
; 串口监视器波特率，与代码里的Serial.begin(115200)保持一致。
monitor_speed = 115200
