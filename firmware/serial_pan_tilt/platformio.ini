; 这个文件定义“电脑串口控制云台”固件的PlatformIO构建环境。
[env:esp32-s3-devkitc-1]
; 使用PlatformIO的Espressif 32平台、编译器和烧录工具。
platform = espressif32
; 当前硬件是ESP32-S3-DevKitC-1兼容开发板。
board = esp32-s3-devkitc-1
; 使用Arduino框架，因此入口函数是setup()和loop()。
framework = arduino
; 串口监视器速度必须与main.cpp中的Serial.begin(115200)一致。
monitor_speed = 115200

