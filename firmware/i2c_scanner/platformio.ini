; [env:名称]定义一个独立的编译环境；该名称也会出现在编译输出中。
[env:esp32-s3-devkitc-1]
; 使用PlatformIO的Espressif 32平台，其中包含ESP32工具链和烧录工具。
platform = espressif32
; 采用ESP32-S3-DevKitC-1开发板的基础引脚和Flash配置。
board = esp32-s3-devkitc-1
; 使用Arduino框架，因此源代码入口是setup()和loop()。
framework = arduino
; 串口监视器使用115200波特，必须与Serial.begin(115200)一致。
monitor_speed = 115200
